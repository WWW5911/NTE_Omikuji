name: Build and release

# Every push and pull request is built and tested. A push to main whose version in
# Directory.Build.props has no release yet publishes one, so releasing means bumping
# that version.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Windows exe
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json

      - name: Install MAUI workload
        run: dotnet workload install maui-windows

      - name: Read version
        id: version
        run: |
          $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.]+)?$') { throw "Unexpected version: $version" }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$version"

      - name: Test
        run: dotnet test tests\NteOmikuji.Core.Tests -c Release --nologo

      - name: Publish single exe
        run: dotnet publish src\NteOmikuji.App -p:PublishProfile=Portable --nologo

      - name: Package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $name = "NTE-Omikuji-v$env:VERSION-win-x64.exe"
          Copy-Item publish\NteOmikuji.exe "dist\$name"
          $hash = (Get-FileHash "dist\$name" -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path "dist\$name.sha256" -Value "$hash  $name" -Encoding ascii

      - name: Upload build
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: windows-exe
          path: dist/
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Only this job can write, and it runs nothing from the repository.
    permissions:
      contents: write

    steps:
      - name: Download build
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: windows-exe
          path: dist

      - name: Create release if this version has none
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          tag="v${VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists. Bump the version in Directory.Build.props to publish a new one."
            exit 0
          fi
          flags=()
          if [[ "$VERSION" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$tag" dist/* --target "$GITHUB_SHA" --title "$tag" --generate-notes "${flags[@]}"
